<!DOCTYPE html>
<html>
<head>
    <title>Nexus • History</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/history.css') }}">
</head>

<body>

    <div class="top-bar">
        <a href="/" class="back-btn">← Dashboard</a>
        <h1>Conversation History</h1>
    </div>

    <div class="history-container">

    {% if history %}

        {% for item in history|reverse %}

        <div class="history-card">

            <div class="history-tag {{ item.classification|lower }}">
                {{ item.classification }}
            </div>

            <div class="history-section">
                <h3>You</h3>
                <p>{{ item.user }}</p>
            </div>

            <div class="history-section">
                <h3>Nexus</h3>
                <div class="history-output">
                    {{ item.assistant|safe }}
                </div>
            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="empty-history">
            <h2>No conversations yet.</h2>
            <p>Start chatting with Nexus to see your history here.</p>
        </div>

    {% endif %}

    </div>

</body>
</html>
