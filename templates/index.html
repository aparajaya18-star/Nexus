<!DOCTYPE html>
<html>  
    <head>
        <title>Nexus</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <h1>Nexus</h1>
        <div class="dashboard">
            <div class="chat-bot">
                <header>
                    <h2>⁺₊✧ Nexus</h2>
                </header>
                <ul class="chatbox">
                    <li class="chat-incoming chat">
                        <p>How can I assist you today?</p>
                    </li>
                </ul>
                <div class="chat-input">
                    <textarea rows="0" cols="17" placeholder="Enter a message"></textarea>
                    <button id="send-btn">></button>
                </div>
            </div>
            <div class="lists">

                <div class="event">
                    <h2>Upcoming Events</h2>
                    <ul class="task-list">
                    </ul>
                </div>

                <div class="todo">
                    <h2>Today's Focus</h2>
                    <ul class="task-list">
                    </ul>
                </div>

                <div class="goal">
                    <h2>Goals</h2>
                    <ul class="task-list">
                    </ul>
                </div>

                <div class="overdue">
                    <h2>Overdue Tasks</h2>
                    <ul class="task-list">
                    </ul>
                </div>

            </div>

            <div class="calendar-container" aria-label="Calendar">
                <div class="calendar-header">
                    <button id="prev-month">‹</button>
                    <h2 class="month-year">
                        <span id="calendar-month">{{ current_month }}</span>
                        <span id="calendar-year">{{ current_year }}</span>
                    </h2>
                    <button id="next-month">›</button>  
                </div>
            
                <div class="calendar-grid">
                    <div class="calendar-weekdays">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    <div class="calendar-days" id="calendar-days">
                        <!-- Days will be populated here by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
        <div class="history-btn">
            <a href="/history">View History →</a>
        </div>
        <script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>
        <script src="{{ url_for('static', filename='js/calendar.js') }}" defer></script>
    <footer>
        © 2026 Aparajaya · Nexus
    </footer>
    </body>
</html>
